plugins {
    id 'com.android.application'
}

android {
    namespace 'com.esf06.visitas'
    compileSdk 36

    defaultConfig {
        applicationId 'com.esf06.visitas'
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName '4.0.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
