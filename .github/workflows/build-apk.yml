name: Build and test ESF06 APK base

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'esf06-visitas-android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esf06-visitas-android

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK signature and archive
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256.txt

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and open on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          working-directory: esf06-visitas-android
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.esf06.visitas
            adb shell am start -W -n com.esf06.visitas/.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -q 'com.esf06.visitas/.MainActivity'
            if adb logcat -d | grep -E 'FATAL EXCEPTION|VerifyError|ClassNotFoundException.*com\.esf06\.visitas'; then echo 'Fatal Android startup error detected'; exit 1; else echo 'No fatal startup errors detected'; fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: esf06-visitas-base-apk
          path: |
            esf06-visitas-android/app/build/outputs/apk/debug/app-debug.apk
            esf06-visitas-android/app/build/outputs/apk/debug/SHA256.txt
          if-no-files-found: error
          retention-days: 7
